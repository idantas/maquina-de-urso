<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Máquina de Urso</title>
    <link rel="icon" type="image/png" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/GeistPixel-Square.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="app">
      <header class="hud">
        <button id="menuBtn" class="mute" aria-label="Menu">☰</button>
        <div class="score">🧸 <span id="score">0</span></div>
        <div class="score">🪙 <span id="coins">10</span></div>
        <div id="shelf" class="shelf"></div>
        <button id="mute" class="mute" aria-label="Som">🔊</button>
      </header>
      <main id="stage" class="stage"><canvas id="game"></canvas></main>
      <footer class="controls">
        <div id="stick" class="stick" role="slider" aria-label="Alavanca">
          <div class="stick-base"></div>
          <div class="stick-shaft"><div class="stick-ball"></div></div>
        </div>
        <button id="grab" class="grab">PEGAR</button>
      </footer>
    </div>

    <div id="win" class="overlay hidden">
      <div class="card pop">
        <div class="win-title">VOCÊ PEGOU!</div>
        <div id="winChar" class="win-char"></div>
        <div id="winName" class="win-name"></div>
        <div class="hint">toque para continuar</div>
      </div>
    </div>

    <div id="start" class="overlay">
      <div class="card start">
        <div class="start-title">MÁQUINA<br />DE URSO</div>
        <div id="startChars" class="start-chars"></div>
        <input id="nameInput" class="name-input" maxlength="12" placeholder="Seu nome" autocomplete="off" enterkeyhint="go" />
        <div id="levelPick" class="levels"></div>
        <div id="stagePick" class="stages"></div>
        <button id="play" class="play">JOGAR ▶</button>
        <button data-act="rank" class="link">🏆 Ranking</button>
      </div>
    </div>

    <div id="menu" class="overlay hidden">
      <div class="panel pop">
        <div class="panel-title">PAUSA</div>
        <button data-act="resume" class="menu-btn primary">▶ Continuar</button>
        <button data-act="restart" class="menu-btn">↻ Reiniciar</button>
        <button data-act="stage" class="menu-btn">🗺️ Trocar fase</button>
        <button data-act="level" class="menu-btn">⇅ Trocar nível</button>
        <button data-act="rank" class="menu-btn">🏆 Ranking</button>
        <button data-act="exit" class="menu-btn">✕ Sair do jogo</button>
      </div>
    </div>

    <div id="over" class="overlay hidden">
      <div class="panel pop">
        <div class="panel-title">FIM DE JOGO</div>
        <div id="overText" class="over-text"></div>
        <div id="overPlace" class="over-place"></div>
        <div id="overGoal" class="hint"></div>
        <button data-act="restart" class="menu-btn primary">↻ Jogar de novo</button>
        <button data-act="rank" class="menu-btn">🏆 Ranking</button>
        <button data-act="exit" class="menu-btn">✕ Menu inicial</button>
      </div>
    </div>

    <div id="levelMenu" class="overlay top hidden">
      <div class="panel pop">
        <div class="panel-title">NÍVEL</div>
        <div id="levelPick2" class="levels col"></div>
        <button data-act="close" class="link">voltar</button>
      </div>
    </div>

    <div id="stageMenu" class="overlay top hidden">
      <div class="panel pop">
        <div class="panel-title">FASES</div>
        <div id="stagePick2" class="stages"></div>
        <button data-act="close" class="link">voltar</button>
      </div>
    </div>

    <div id="clear" class="overlay hidden">
      <div class="panel pop">
        <div class="panel-title">FASE COMPLETA!</div>
        <div id="clearText" class="over-place"></div>
        <div id="clearChars" class="start-chars clear-chars"></div>
        <button id="nextStage" data-act="nextStage" class="menu-btn primary">Próxima fase ▶</button>
        <button data-act="resume" class="menu-btn">Continuar jogando</button>
      </div>
    </div>

    <div id="rank" class="overlay top hidden">
      <div class="panel pop">
        <div class="panel-title">🏆 RANKING</div>
        <div id="rankTabs" class="levels"></div>
        <ol id="rankList" class="rank-list"></ol>
        <button data-act="close" class="menu-btn primary">Fechar</button>
      </div>
    </div>

    <canvas id="fx"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
