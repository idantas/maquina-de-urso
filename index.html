<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0710" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Máquina de Urso</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕹️</text></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app">
      <header class="hud">
        <div class="score">🏆 <span id="score">0</span></div>
        <div id="shelf" class="shelf"></div>
        <button id="mute" class="mute" aria-label="Som">🔊</button>
      </header>
      <main id="stage" class="stage"><canvas id="game"></canvas></main>
      <footer class="controls">
        <div id="stick" class="stick" role="slider" aria-label="Alavanca">
          <div class="stick-base"></div>
          <div class="stick-shaft"><div class="stick-ball"></div></div>
        </div>
        <button id="grab" class="grab">PEGAR</button>
      </footer>
    </div>

    <div id="win" class="overlay hidden">
      <div class="card pop">
        <div class="win-title">VOCÊ PEGOU!</div>
        <div id="winChar" class="win-char"></div>
        <div id="winName" class="win-name"></div>
        <div class="hint">toque para continuar</div>
      </div>
    </div>

    <div id="start" class="overlay">
      <div class="card">
        <div class="start-title">MÁQUINA<br />DE URSO</div>
        <div id="startChars" class="start-chars"></div>
        <button id="play" class="play">JOGAR ▶</button>
      </div>
    </div>

    <canvas id="fx"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
